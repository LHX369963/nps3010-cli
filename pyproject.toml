[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nps3010-cli"
version = "0.1.0"
description = "Linux CLI for up to two NPS3010 CH340 bench power supplies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]
license = "MIT"
authors = [{name = "LHX369963"}]
keywords = ["power-supply", "serial", "ch340", "instrument"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.16"]

[project.scripts]
nps3010 = "nps3010_cli.cli:main"

[tool.setuptools]
packages = ["nps3010_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
