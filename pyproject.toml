[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-psu-cli"
version = "0.1.0"
description = "Linux CLI upper computer for up to two custom CH340 bench power supplies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]
license = "MIT"
authors = [{name = "LHX369963"}]
keywords = ["power-supply", "serial", "ch340", "instrument"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
psuctl = "psu_cli.cli:main"

[tool.setuptools]
packages = ["psu_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
